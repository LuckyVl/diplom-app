name: CI/CD Diplom App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: cr.yandex
  REGISTRY_NAME: diplom-registry-luckyvl

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate to Yandex Cloud
        run: |
          echo '${{ secrets.YC_SA_KEY }}' > sa-key.json
          yc config profile create ci-cd-profile
          yc config profile activate ci-cd-profile
          yc config set service-account-key sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Get Registry ID dynamically
        id: get_registry
        run: |
          REGISTRY_ID=$(yc container registry get --name ${{ env.REGISTRY_NAME }} --format json | jq -r '.id')
          echo "REGISTRY_ID=$REGISTRY_ID" >> $GITHUB_ENV
          echo "IMAGE_NAME=$REGISTRY_ID/diplom-app" >> $GITHUB_ENV
          echo "✅ Found Registry ID: $REGISTRY_ID"

      - name: Log in to Yandex Container Registry
        run: |
          echo "🔐 Аутентификация в Yandex Container Registry..."
          
          # Очищаем старый конфиг Docker, чтобы убрать credential helper
          rm -f ~/.docker/config.json
          
          # Создаем IAM токен
          IAM_TOKEN=$(yc iam create-token)
          
          # Выполняем docker login с IAM токеном
          echo "$IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          
          echo "✅ Authentication successful!"
    
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate to Yandex Cloud
        run: |
          echo '${{ secrets.YC_SA_KEY }}' > sa-key.json
          yc config profile create ci-cd-profile
          yc config profile activate ci-cd-profile
          yc config set service-account-key sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Get Registry ID dynamically
        run: |
          REGISTRY_ID=$(yc container registry get --name ${{ env.REGISTRY_NAME }} --format json | jq -r '.id')
          echo "REGISTRY_ID=$REGISTRY_ID" >> $GITHUB_ENV
          echo "IMAGE_NAME=$REGISTRY_ID/diplom-app" >> $GITHUB_ENV
          echo "✅ Found Registry ID: $REGISTRY_ID"

      - name: Get Bastion Public IP
        run: |
          BASTION_IP=$(yc compute instance get bastion --format json | jq -r '.network_interfaces[0].primary_v4_address.one_to_one_nat.address')
          echo "BASTION_IP=$BASTION_IP" >> $GITHUB_ENV
          echo "Found Bastion IP: $BASTION_IP"

      - name: Get Master Internal IP
        run: |
          MASTER_IP=$(yc compute instance get k8s-master --format json | jq -r '.network_interfaces[0].primary_v4_address.address')
          echo "MASTER_IP=$MASTER_IP" >> $GITHUB_ENV
          echo "Found Master IP: $MASTER_IP"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/diplom_cloud
          chmod 600 ~/.ssh/diplom_cloud
          ssh-keyscan -H ${{ env.BASTION_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Kubernetes via Bastion
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          BASTION_IP="${{ env.BASTION_IP }}"
          MASTER_IP="${{ env.MASTER_IP }}"
          
          echo "Deploying image: $IMAGE_URI"
          echo "Bastion IP: $BASTION_IP"
          echo "Master IP: $MASTER_IP"
          
          # Создаем SSH конфиг
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << EOF
          Host bastion
              HostName $BASTION_IP
              User ubuntu
              IdentityFile ~/.ssh/diplom_cloud
              StrictHostKeyChecking no
              IdentitiesOnly yes
              UserKnownHostsFile /dev/null
              LogLevel ERROR
          
          Host k8s-master
              HostName $MASTER_IP
              User ubuntu
              ProxyJump bastion
              StrictHostKeyChecking no
              IdentitiesOnly yes
              UserKnownHostsFile /dev/null
              LogLevel ERROR
          EOF
          
          chmod 600 ~/.ssh/config
          
          # Выполняем деплой через SSH на мастер-ноду
          echo "Updating deployment..."
          ssh k8s-master "sudo kubectl --kubeconfig /etc/kubernetes/admin.conf set image deployment/diplom-app nginx=$IMAGE_URI -n default"
          
          echo "✅ Deployment triggered successfully!"